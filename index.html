<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMAN · Painel de Eleição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10141A; --bg-elev:#161C24; --surface:#1D2530; --surface-2:#252E3B;
    --border:#303A47; --text:#E7ECF2; --text-dim:#93A0B0; --text-faint:#5C6879;
    --amber:#E8A93A;
    --verde:#3DDC84; --azul:#00abfb; --vermelho:#EF5350; --roxo:#B18CFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 18px 60px;}

  /* HEADER */
  header{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;
    padding:20px 22px;background:linear-gradient(135deg,var(--bg-elev),var(--surface));
    border:1px solid var(--border);border-radius:14px;margin-bottom:18px;position:relative;overflow:hidden;}
  header::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber);}
  .htitle{display:flex;flex-direction:column;gap:2px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;}
  h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:26px;margin:0;}

  /* INDICADOR */
  .update-indicator{font-size:11px;color:var(--text-faint);text-align:right;margin-bottom:14px;}

  /* CARDS RESUMO */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .summary-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;}
  .summary-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;}
  .summary-card.total::before{background:var(--amber);}
  .summary-card.operantes::before{background:var(--azul);}
  .summary-card.baixadas::before{background:var(--vermelho);}
  .summary-card.supervisores::before{background:var(--roxo);}
  .summary-card .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;}
  .summary-card .value{font-family:'Rajdhani',sans-serif;font-size:34px;font-weight:700;line-height:1;}
  .summary-card.total .value{color:var(--amber);}
  .summary-card.operantes .value{color:var(--azul);}
  .summary-card.baixadas .value{color:var(--vermelho);}
  .summary-card.supervisores .value{color:var(--roxo);}

  /* TOOLBAR */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;overflow-x:auto;}
  .tab{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;padding:8px 16px;border-radius:7px;cursor:pointer;color:var(--text-dim);border:none;background:transparent;white-space:nowrap;}
  .tab.active{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border);}
  .right-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input[type=text]{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;min-width:0;font-family:'Inter',sans-serif;}
  input:focus{outline:1px solid var(--amber);}

  /* BOTÕES */
  .btn{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;padding:9px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);white-space:nowrap;}
  .btn:hover{border-color:var(--amber);}
  .btn.primary{background:var(--amber);color:#1a1204;border-color:var(--amber);}
  .btn.ghost{background:transparent;}
  .btn.danger:hover{border-color:var(--vermelho);color:var(--vermelho);}

  /* GRID DE VIATURAS */
  .veh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;}
  .veh-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--azul);border-radius:11px;padding:14px 16px;transition:transform .15s, box-shadow .15s;display:flex;flex-direction:column;gap:8px;}
  .veh-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3);}
  .veh-card.baixada{border-left-color:var(--vermelho);opacity:.92;}
  .veh-header{display:flex;justify-content:space-between;align-items:center;}
  .veh-prefix{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:22px;}
  .veh-unidade{font-size:12px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;background:var(--surface-2);padding:2px 8px;border-radius:12px;border:1px solid var(--border);}
  .veh-info{display:flex;flex-direction:column;gap:4px;font-size:13px;}
  .veh-info span.label{color:var(--text-dim);font-size:11px;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;}
  .veh-obs{font-size:11px;color:var(--text-faint);font-style:italic;margin-top:4px;}
  .veh-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;border-top:1px solid var(--border);padding-top:8px;}
  .veh-actions .btn{font-size:11px;padding:5px 8px;}

  /* BADGES */
  .badge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border-radius:12px;border:1px solid var(--border);white-space:nowrap;}
  .badge.operante{background:rgba(0,171,251,.15);color:var(--azul);border-color:var(--azul);}
  .badge.baixada{background:rgba(239,83,80,.15);color:var(--vermelho);border-color:var(--vermelho);}
  .badge.supervisor{background:rgba(177,140,255,.15);color:var(--roxo);border-color:var(--roxo);}
  .badge.auxiliar{background:rgba(61,220,132,.15);color:var(--verde);border-color:var(--verde);}
  .badge.apoio{background:rgba(232,169,58,.15);color:var(--amber);border-color:var(--amber);}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(16,20,26,.85);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 24px;width:100%;max-width:500px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto;}
  .modal-box h2{font-family:'Rajdhani',sans-serif;font-size:20px;margin:0;color:var(--amber);}
  .modal-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .modal-grid label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;}
  .modal-grid input, .modal-grid select{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 11px;font-size:13px;font-family:'Inter',sans-serif;}
  .modal-grid input:focus, .modal-grid select:focus{outline:1px solid var(--amber);}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;}

  .empty{text-align:center;color:var(--text-faint);padding:40px 20px;font-size:14px;grid-column:1/-1;}
  footer{text-align:center;color:var(--text-faint);font-size:11px;margin-top:40px;}
</style>
</head>
<body>

<div id="actionModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h2 id="modalTitle">Ação</h2>
    <div class="modal-grid" id="modalFields"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">Cancelar</button>
      <button class="btn primary" id="modalConfirm">Confirmar</button>
    </div>
  </div>
</div>

<div class="wrap">
  <header>
    <div class="htitle">
      <div class="eyebrow">DEMAN · Apoio Visual à Eleição</div>
      <h1>Painel de Viaturas e Equipes</h1>
    </div>
  </header>

  <div class="update-indicator" id="updateStatus">Carregando dados...</div>

  <div class="summary" id="summaryCards"></div>

  <div class="toolbar">
    <div class="tabs" id="tabsContainer"></div>
    <div class="right-tools">
      <input type="text" id="search" placeholder="Buscar prefixo, condutor ou unidade">
      <button class="btn" id="addBtn">+ Nova Viatura</button>
    </div>
  </div>

  <div class="veh-grid" id="vehGrid"></div>

  <footer>Dados carregados da planilha Google Sheets. Painel de apoio à Eleição.</footer>
</div>

<script>
// ============================================================
// CONFIGURAÇÃO DA PLANILHA (SUBSTITUA PELO SEU ID)
// ============================================================
const SHEET_ID = 'SEU_ID_DA_PLANILHA_AQUI'; 
const SHEET_NAME = 'Eleicao';
const API_KEY = 'SUA_API_KEY_AQUI'; // Se necessário, ou use o link publicado como CSV

// Para facilitar, vamos simular os dados enquanto você não coloca a URL real.
// Quando tiver a planilha, descomente a função fetchData e comente a simulação.
let viaturas = [
  { prefixo: 'ABS-01', tipo: 'ABS', unidade: '1º GBM', status: 'Operante', condutor: 'João Silva', funcao: 'Supervisor', obs: '' },
  { prefixo: 'UR-14', tipo: 'UR', unidade: '2º GBM', status: 'Baixada', condutor: 'Maria Souza', funcao: 'Auxiliar', obs: 'Pneu furado' },
  { prefixo: 'APC-01', tipo: 'APC', unidade: 'DEMAN', status: 'Operante', condutor: 'Carlos Lima', funcao: 'Apoio', obs: '' },
  { prefixo: 'ABS-10', tipo: 'ABS', unidade: '3º GBM', status: 'Operante', condutor: 'Ana Paula', funcao: 'Supervisor', obs: '' },
  { prefixo: 'UR-16', tipo: 'UR', unidade: '4º GBM', status: 'Operante', condutor: 'Pedro Santos', funcao: 'Motorista', obs: '' }
];

let filtroAtivo = 'Todas';
let termoBusca = '';

// ============================================================
// FUNÇÕES DE RENDERIZAÇÃO
// ============================================================
function renderTudo() {
  renderResumo();
  renderAbas();
  renderGrid();
  document.getElementById('updateStatus').innerText = 'Última atualização: ' + new Date().toLocaleString('pt-BR');
}

function renderResumo() {
  const total = viaturas.length;
  const operantes = viaturas.filter(v => v.status === 'Operante').length;
  const baixadas = viaturas.filter(v => v.status === 'Baixada').length;
  const supervisores = viaturas.filter(v => v.funcao === 'Supervisor').length;

  document.getElementById('summaryCards').innerHTML = `
    <div class="summary-card total"><div class="label">Total de Viaturas</div><div class="value">${total}</div></div>
    <div class="summary-card operantes"><div class="label">Operantes</div><div class="value">${operantes}</div></div>
    <div class="summary-card baixadas"><div class="label">Baixadas</div><div class="value">${baixadas}</div></div>
    <div class="summary-card supervisores"><div class="label">Supervisores</div><div class="value">${supervisores}</div></div>
  `;
}

function renderAbas() {
  const unidades = ['Todas', ...new Set(viaturas.map(v => v.unidade))];
  document.getElementById('tabsContainer').innerHTML = unidades.map(u => 
    `<button class="tab ${filtroAtivo === u ? 'active' : ''}" onclick="mudarFiltro('${u}')">${u}</button>`
  ).join('');
}

function renderGrid() {
  let filtradas = viaturas;
  if (filtroAtivo !== 'Todas') filtradas = filtradas.filter(v => v.unidade === filtroAtivo);
  if (termoBusca) {
    const t = termoBusca.toLowerCase();
    filtradas = filtradas.filter(v => 
      v.prefixo.toLowerCase().includes(t) || 
      v.condutor.toLowerCase().includes(t) || 
      v.unidade.toLowerCase().includes(t)
    );
  }

  const grid = document.getElementById('vehGrid');
  if (filtradas.length === 0) {
    grid.innerHTML = '<div class="empty">Nenhuma viatura encontrada.</div>';
    return;
  }

  grid.innerHTML = filtradas.map((v, index) => {
    const isBaixada = v.status === 'Baixada';
    const funcaoClass = v.funcao ? v.funcao.toLowerCase() : '';
    const funcaoBadge = v.funcao ? `<span class="badge ${funcaoClass}">${v.funcao}</span>` : '';
    
    // Encontra o índice real no array original para ações
    const realIndex = viaturas.findIndex(orig => orig.prefixo === v.prefixo);

    return `
      <div class="veh-card ${isBaixada ? 'baixada' : ''}">
        <div class="veh-header">
          <div class="veh-prefix">${v.prefixo}</div>
          <span class="badge ${isBaixada ? 'baixada' : 'operante'}">${v.status}</span>
        </div>
        <div class="veh-unidade">${v.unidade} · ${v.tipo}</div>
        <div class="veh-info">
          <div><span class="label">Condutor:</span> ${v.condutor || 'Não informado'}</div>
          <div>${funcaoBadge}</div>
        </div>
        ${v.obs ? `<div class="veh-obs">Obs: ${v.obs}</div>` : ''}
        <div class="veh-actions">
          <button class="btn" onclick="abrirModalEditar(${realIndex})">✏️ Editar</button>
          <button class="btn ${isBaixada ? 'primary' : 'danger'}" onclick="alternarStatus(${realIndex})">
            ${isBaixada ? '✅ Operar' : '⛔ Baixar'}
          </button>
        </div>
      </div>
    `;
  }).join('');
}

// ============================================================
// AÇÕES
// ============================================================
window.mudarFiltro = (u) => { filtroAtivo = u; renderTudo(); };
document.getElementById('search').addEventListener('input', (e) => { termoBusca = e.target.value; renderGrid(); });

// Modal de Edição / Adição
let editandoIndex = -1;
const modal = document.getElementById('actionModal');
const modalTitle = document.getElementById('modalTitle');
const modalFields = document.getElementById('modalFields');

function abrirModalNovo() {
  editandoIndex = -1;
  modalTitle.innerText = 'Nova Viatura';
  modalFields.innerHTML = `
    <label>Prefixo <input type="text" id="fPrefixo" placeholder="Ex: ABS-01"></label>
    <label>Tipo <input type="text" id="fTipo" placeholder="Ex: ABS, UR, APC"></label>
    <label>Unidade <input type="text" id="fUnidade" placeholder="Ex: 1º GBM" list="listaUnidades"></label>
    <datalist id="listaUnidades">
      <option value="1º GBM"><option value="2º GBM"><option value="3º GBM">
      <option value="4º GBM"><option value="5º GBM"><option value="6º GBM">
      <option value="7º GBM"><option value="DEMAN">
    </datalist>
    <label>Status <select id="fStatus"><option value="Operante">Operante</option><option value="Baixada">Baixada</option></select></label>
    <label>Condutor <input type="text" id="fCondutor" placeholder="Nome do condutor"></label>
    <label>Função <select id="fFuncao">
      <option value="">Nenhuma</option>
      <option value="Supervisor">Supervisor</option>
      <option value="Auxiliar">Auxiliar</option>
      <option value="Apoio">Apoio</option>
      <option value="Motorista">Motorista</option>
    </select></label>
    <label>Observações <input type="text" id="fObs" placeholder="Opcional"></label>
  `;
  modal.style.display = 'flex';
}

function abrirModalEditar(index) {
  editandoIndex = index;
  const v = viaturas[index];
  modalTitle.innerText = 'Editar Viatura';
  modalFields.innerHTML = `
    <label>Prefixo <input type="text" id="fPrefixo" value="${v.prefixo}"></label>
    <label>Tipo <input type="text" id="fTipo" value="${v.tipo}"></label>
    <label>Unidade <input type="text" id="fUnidade" value="${v.unidade}" list="listaUnidades"></label>
    <datalist id="listaUnidades">
      <option value="1º GBM"><option value="2º GBM"><option value="3º GBM">
      <option value="4º GBM"><option value="5º GBM"><option value="6º GBM">
      <option value="7º GBM"><option value="DEMAN">
    </datalist>
    <label>Status <select id="fStatus">
      <option value="Operante" ${v.status === 'Operante' ? 'selected' : ''}>Operante</option>
      <option value="Baixada" ${v.status === 'Baixada' ? 'selected' : ''}>Baixada</option>
    </select></label>
    <label>Condutor <input type="text" id="fCondutor" value="${v.condutor || ''}"></label>
    <label>Função <select id="fFuncao">
      <option value="">Nenhuma</option>
      <option value="Supervisor" ${v.funcao === 'Supervisor' ? 'selected' : ''}>Supervisor</option>
      <option value="Auxiliar" ${v.funcao === 'Auxiliar' ? 'selected' : ''}>Auxiliar</option>
      <option value="Apoio" ${v.funcao === 'Apoio' ? 'selected' : ''}>Apoio</option>
      <option value="Motorista" ${v.funcao === 'Motorista' ? 'selected' : ''}>Motorista</option>
    </select></label>
    <label>Observações <input type="text" id="fObs" value="${v.obs || ''}"></label>
  `;
  modal.style.display = 'flex';
}

document.getElementById('modalCancel').onclick = () => modal.style.display = 'none';
document.getElementById('modalConfirm').onclick = () => {
  const dados = {
    prefixo: document.getElementById('fPrefixo').value.trim(),
    tipo: document.getElementById('fTipo').value.trim(),
    unidade: document.getElementById('fUnidade').value.trim(),
    status: document.getElementById('fStatus').value,
    condutor: document.getElementById('fCondutor').value.trim(),
    funcao: document.getElementById('fFuncao').value,
    obs: document.getElementById('fObs').value.trim()
  };
  if (!dados.prefixo) return alert('O prefixo é obrigatório!');

  if (editandoIndex === -1) {
    viaturas.push(dados);
  } else {
    viaturas[editandoIndex] = dados;
  }
  modal.style.display = 'none';
  renderTudo();
};

function alternarStatus(index) {
  viaturas[index].status = viaturas[index].status === 'Operante' ? 'Baixada' : 'Operante';
  renderTudo();
}

document.getElementById('addBtn').onclick = abrirModalNovo;

// ============================================================
// INICIALIZAÇÃO
// ============================================================
// Se quiser carregar da planilha real, use a função abaixo no lugar da simulação:
/*
async function carregarDados() {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
    const resp = await fetch(url);
    const text = await resp.text();
    const json = JSON.parse(text.substr(47).slice(0, -2));
    const rows = json.table.rows;
    viaturas = rows.map(r => ({
      prefixo: r.c[0]?.v || '',
      tipo: r.c[1]?.v || '',
      unidade: r.c[2]?.v || '',
      status: r.c[3]?.v || 'Operante',
      condutor: r.c[4]?.v || '',
      funcao: r.c[5]?.v || '',
      obs: r.c[6]?.v || ''
    }));
    renderTudo();
  } catch(e) {
    console.error('Erro ao carregar planilha:', e);
    document.getElementById('updateStatus').innerText = 'Erro ao carregar dados. Usando dados locais.';
    renderTudo();
  }
}
carregarDados();
*/

// Usando dados simulados por enquanto:
renderTudo();

</script>
</body>
</html>
