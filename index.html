<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMAN · Painel de Eleição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10141A; --bg-elev:#161C24; --surface:#1D2530; --surface-2:#252E3B;
    --border:#303A47; --text:#E7ECF2; --text-dim:#93A0B0; --text-faint:#5C6879;
    --amber:#E8A93A;
    --verde:#3DDC84; --azul:#00abfb; --vermelho:#EF5350; --roxo:#B18CFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 18px 60px;}

  /* HEADER */
  header{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;
    padding:20px 22px;background:linear-gradient(135deg,var(--bg-elev),var(--surface));
    border:1px solid var(--border);border-radius:14px;margin-bottom:18px;position:relative;overflow:hidden;}
  header::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber);}
  .htitle{display:flex;flex-direction:column;gap:2px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;}
  h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:26px;margin:0;}

  /* INDICADOR */
  .update-indicator{font-size:11px;color:var(--text-faint);text-align:right;margin-bottom:14px;}
  .update-indicator button { background:none; border:none; color:var(--amber); cursor:pointer; text-decoration:underline; font-size:11px; font-family:'Inter',sans-serif; }

  /* CARDS RESUMO */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .summary-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;cursor:pointer;transition:all 0.2s ease;}
  .summary-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;}
  .summary-card.total::before{background:var(--amber);}
  .summary-card.operantes::before{background:var(--azul);}
  .summary-card.baixadas::before{background:var(--vermelho);}
  .summary-card.semcontato::before{background:var(--roxo);}
  .summary-card .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;}
  .summary-card .value{font-family:'Rajdhani',sans-serif;font-size:34px;font-weight:700;line-height:1;}
  .summary-card.total .value{color:var(--amber);}
  .summary-card.operantes .value{color:var(--azul);}
  .summary-card.baixadas .value{color:var(--vermelho);}
  .summary-card.semcontato .value{color:var(--roxo);}
  .summary-card:hover { background: var(--surface-2); transform: translateY(-2px); }
  .summary-card.active { background: var(--surface-2); border-color: var(--text-dim); box-shadow: 0 0 15px rgba(255,255,255,0.05); }
  .summary-card.active.total { border-color: var(--amber); box-shadow: 0 0 15px rgba(232,169,58,0.2); }
  .summary-card.active.operantes { border-color: var(--azul); box-shadow: 0 0 15px rgba(0,171,251,0.2); }
  .summary-card.active.baixadas { border-color: var(--vermelho); box-shadow: 0 0 15px rgba(239,83,80,0.2); }
  .summary-card.active.semcontato { border-color: var(--roxo); box-shadow: 0 0 15px rgba(177,140,255,0.2); }

  /* TOOLBAR */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;overflow-x:auto;}
  .tab{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;padding:8px 16px;border-radius:7px;cursor:pointer;color:var(--text-dim);border:none;background:transparent;white-space:nowrap;}
  .tab.active{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border);}
  .right-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input[type=text]{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;min-width:0;font-family:'Inter',sans-serif;}
  input:focus{outline:1px solid var(--amber);}

  /* BOTÕES */
  .btn{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;padding:9px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);white-space:nowrap;}
  .btn:hover{border-color:var(--amber);}
  .btn.primary{background:var(--amber);color:#1a1204;border-color:var(--amber);}
  .btn.ghost{background:transparent;}
  .btn.danger:hover{border-color:var(--vermelho);color:var(--vermelho);}

  /* BOTÃO DE ÍCONE (LÁPIS) */
  .btn-icon {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer; transition: all 0.2s ease;
    padding: 0; flex-shrink: 0;
  }
  .btn-icon:hover { background: var(--surface); color: var(--amber); border-color: var(--amber); }
  .btn-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* BLOCOS */
  .blocks-container{display:flex;flex-direction:column;gap:20px;}
  .block{background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .block-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--surface);cursor:pointer;user-select:none;border-bottom:1px solid var(--border);}
  .block-header:hover{background:var(--surface-2);}
  .block-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;color:var(--text);display:flex;align-items:center;gap:10px;}
  .block-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);background:var(--surface-2);padding:2px 8px;border-radius:12px;border:1px solid var(--border);}
  .block-toggle{font-size:12px;color:var(--text-dim);transition:transform 0.2s;}
  .block[open] .block-toggle{transform:rotate(180deg);}
  .block-content{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;}

  /* CARDS DE VIATURA */
  .veh-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px 16px;transition:transform .15s, box-shadow .15s;display:flex;flex-direction:column;gap:8px;}
  .veh-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3);}
  .veh-card.baixada{opacity:.92;}
  .veh-card.sem-contato-alerta { border-color: rgba(177,140,255,.4); }
  
  .veh-header{display:flex;justify-content:space-between;align-items:center;}
  .veh-prefix{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:22px;}
  .veh-placa{font-size:12px;color:var(--amber);font-family:'IBM Plex Mono',monospace;font-weight:600;margin-left:6px;}
  .veh-unidade{font-size:12px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;background:var(--surface-2);padding:2px 8px;border-radius:12px;border:1px solid var(--border);display:inline-block;}
  .veh-info{display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.4;}
  .veh-info span.label{color:var(--text-dim);font-size:11px;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;}
  .veh-obs{font-size:11px;color:var(--text-faint);font-style:italic;margin-top:4px;}
  .veh-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;border-top:1px solid var(--border);padding-top:8px;}

  /* BADGES */
  .badge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border-radius:12px;border:1px solid var(--border);white-space:nowrap;}
  .badge.operante{background:rgba(0,171,251,.15);color:var(--azul);border-color:var(--azul);}
  .badge.baixada{background:rgba(239,83,80,.15);color:var(--vermelho);border-color:var(--vermelho);}
  .badge.propria{background:rgba(61,220,132,.1);color:var(--verde);border-color:var(--verde);}
  .badge.locada{background:rgba(232,169,58,.1);color:var(--amber);border-color:var(--amber);}
  .badge.sem-contato{background:rgba(177,140,255,.15);color:var(--roxo);border-color:var(--roxo);}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(16,20,26,.85);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 24px;width:100%;max-width:500px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto;}
  .modal-box h2{font-family:'Rajdhani',sans-serif;font-size:20px;margin:0;color:var(--amber);}
  .modal-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .modal-grid label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;}
  .modal-grid input, .modal-grid select{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 11px;font-size:13px;font-family:'Inter',sans-serif;}
  .modal-grid input:focus, .modal-grid select:focus{outline:1px solid var(--amber);}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;}

  .empty{text-align:center;color:var(--text-faint);padding:40px 20px;font-size:14px;grid-column:1/-1;}
  footer{text-align:center;color:var(--text-faint);font-size:11px;margin-top:40px;}
</style>
</head>
<body>

<div id="actionModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h2 id="modalTitle">Ação</h2>
    <div class="modal-grid" id="modalFields"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">Cancelar</button>
      <button class="btn primary" id="modalConfirm">Confirmar</button>
    </div>
  </div>
</div>

<div class="wrap">
  <header>
    <div class="htitle">
      <div class="eyebrow">DEMAN · Apoio Visual à Eleição</div>
      <h1>Painel de Viaturas e Equipes</h1>
    </div>
  </header>

  <div class="update-indicator" id="updateStatus">
    Carregando dados... <button onclick="carregarDados()">(Atualizar)</button>
  </div>

  <div class="summary" id="summaryCards"></div>

  <div class="toolbar">
    <div class="tabs" id="tabsContainer"></div>
    <div class="right-tools">
      <input type="text" id="search" placeholder="Buscar prefixo, condutor, placa...">
      <button class="btn" id="addBtn">+ Nova Viatura</button>
    </div>
  </div>

  <div class="blocks-container" id="blocksContainer"></div>

  <footer>Dados sincronizados com o Google Sheets.</footer>
</div>

<script>
// ============================================================
// CONFIGURAÇÃO - SUA URL DO APPS SCRIPT
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbykNNKd64T7-T48mddNYU4gcHEpYzKbrXf8b7W_9JGf7q3yONQ3AP45XDCO-rvw2iWNrg/exec';

let viaturas = [];
let filtroAtivo = 'Todas';
let filtroStatusAtivo = 'Operante'; 
let termoBusca = '';

// ============================================================
// COMUNICAÇÃO COM O BACKEND
// ============================================================
async function carregarDados() {
  document.getElementById('updateStatus').innerText = 'Carregando dados...';
  try {
    const resp = await fetch(API_URL);
    viaturas = await resp.json();
    renderTudo();
    document.getElementById('updateStatus').innerText = 'Última atualização: ' + new Date().toLocaleString('pt-BR');
  } catch(e) {
    console.error(e);
    document.getElementById('updateStatus').innerText = 'Erro ao conectar com a planilha.';
  }
}

async function enviarParaPlanilha(action, dados) {
  try {
    const payload = { action: action, ...dados };
    const resp = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
      headers: { 'Content-Type': 'text/plain' }
    });
    viaturas = await resp.json();
    renderTudo();
  } catch(e) {
    console.error('Erro ao salvar:', e);
    alert('Erro ao salvar na planilha. Verifique sua conexão.');
  }
}

// ============================================================
// FUNÇÕES DE RENDERIZAÇÃO
// ============================================================
function renderTudo() {
  renderResumo();
  renderAbas();
  renderBlocos();
}

function renderResumo() {
  const total = viaturas.length;
  const operantes = viaturas.filter(v => v.status === 'Operante').length;
  const baixadas = viaturas.filter(v => v.status === 'Baixada').length;
  const semContato = viaturas.filter(v => v.status === 'Operante' && (!v.contato || String(v.contato).trim() === '')).length;

  document.getElementById('summaryCards').innerHTML = `
    <div class="summary-card total ${filtroStatusAtivo === 'Total' ? 'active' : ''}" onclick="mudarFiltroStatus('Total')">
      <div class="label">Total de Viaturas</div><div class="value">${total}</div>
    </div>
    <div class="summary-card operantes ${filtroStatusAtivo === 'Operante' ? 'active' : ''}" onclick="mudarFiltroStatus('Operante')">
      <div class="label">Operantes</div><div class="value">${operantes}</div>
    </div>
    <div class="summary-card baixadas ${filtroStatusAtivo === 'Baixada' ? 'active' : ''}" onclick="mudarFiltroStatus('Baixada')">
      <div class="label">Baixadas</div><div class="value">${baixadas}</div>
    </div>
    <div class="summary-card semcontato ${filtroStatusAtivo === 'SemContato' ? 'active' : ''}" onclick="mudarFiltroStatus('SemContato')">
      <div class="label">Sem Contato</div><div class="value">${semContato}</div>
    </div>
  `;
}

function renderAbas() {
  const todasUnidades = [...new Set(viaturas.map(v => v.unidade))];
  const temDeman = todasUnidades.includes('DEMAN');
  let outras = todasUnidades.filter(u => u !== 'DEMAN');
  outras.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
  
  const unidadesOrdenadas = ['Todas'];
  if (temDeman) unidadesOrdenadas.push('DEMAN');
  unidadesOrdenadas.push(...outras);

  document.getElementById('tabsContainer').innerHTML = unidadesOrdenadas.map(u => 
    `<button class="tab ${filtroAtivo === u ? 'active' : ''}" onclick="mudarFiltro('${u}')">${u}</button>`
  ).join('');
}

function renderBlocos() {
  let filtradas = viaturas;
  
  if (termoBusca) {
    const t = termoBusca.toLowerCase();
    filtradas = filtradas.filter(v => 
      String(v.prefixo || '').toLowerCase().includes(t) || 
      String(v.condutor || '').toLowerCase().includes(t) || 
      String(v.unidade || '').toLowerCase().includes(t) ||
      String(v.placa || '').toLowerCase().includes(t) ||
      String(v.contato || '').toLowerCase().includes(t)
    );
  }

  if (filtroAtivo !== 'Todas') {
    filtradas = filtradas.filter(v => v.unidade === filtroAtivo);
  }

  if (filtroStatusAtivo === 'Operante') {
    filtradas = filtradas.filter(v => v.status === 'Operante');
  } else if (filtroStatusAtivo === 'Baixada') {
    filtradas = filtradas.filter(v => v.status === 'Baixada');
  } else if (filtroStatusAtivo === 'SemContato') {
    filtradas = filtradas.filter(v => v.status === 'Operante' && (!v.contato || String(v.contato).trim() === ''));
  }

  const container = document.getElementById('blocksContainer');
  
  if (filtradas.length === 0) {
    container.innerHTML = '<div class="empty">Nenhuma viatura encontrada com os filtros atuais.</div>';
    return;
  }

  const grupos = {};
  filtradas.forEach(v => {
    const tipo = v.tipo || 'OUTROS';
    if (!grupos[tipo]) grupos[tipo] = [];
    grupos[tipo].push(v);
  });

  const tiposOrdenados = Object.keys(grupos).sort((a, b) => a.localeCompare(b));

  let html = '';
  for (const tipo of tiposOrdenados) {
    const items = grupos[tipo];
    html += `
      <details class="block" open>
        <summary class="block-header">
          <div class="block-title">
            ${tipo} 
            <span class="block-count">${items.length} viaturas</span>
          </div>
          <span class="block-toggle">▼</span>
        </summary>
        <div class="block-content">
          ${items.map(v => renderCard(v)).join('')}
        </div>
      </details>
    `;
  }
  container.innerHTML = html;
}

function renderCard(v) {
  const isBaixada = v.status === 'Baixada';
  const semContato = !v.contato || String(v.contato).trim() === '';
  
  const propBadge = v.propriedade === 'Locada' 
    ? `<span class="badge locada">Locada</span> ${v.empresa ? `<span style="font-size:11px;color:var(--text-dim);">(${v.empresa})</span>` : ''}`
    : `<span class="badge propria">Própria</span>`;

  const contatoDisplay = semContato 
    ? (v.status === 'Operante' ? `<span class="badge sem-contato">⚠ Sem contato</span>` : `<span style="color:var(--text-faint);">—</span>`)
    : `<span style="color:var(--text);">${v.contato}</span>`;

  const cardClass = (isBaixada ? 'baixada' : '') + (semContato && v.status === 'Operante' ? ' sem-contato-alerta' : '');

  const realIndex = viaturas.findIndex(orig => orig.prefixo === v.prefixo);

  return `
    <div class="veh-card ${cardClass}">
      <div class="veh-header">
        <div class="veh-prefix">${v.prefixo} <span class="veh-placa">${v.placa || 'S/ Placa'}</span></div>
        <span class="badge ${isBaixada ? 'baixada' : 'operante'}">${v.status}</span>
      </div>
      <div class="veh-unidade">${v.unidade}</div>
      <div class="veh-info">
        <div><span class="label">Condutor:</span> ${v.condutor || 'Não informado'}</div>
        <div><span class="label">Contato:</span> ${contatoDisplay}</div>
        <div><span class="label">Propriedade:</span> ${propBadge}</div>
        ${v.cartao ? `<div><span class="label">Cartão Abast.:</span> ${v.cartao}</div>` : ''}
      </div>
      ${v.obs ? `<div class="veh-obs">Obs: ${v.obs}</div>` : ''}
      <div class="veh-actions">
        <button class="btn-icon" onclick="abrirModalEditar(${realIndex})" title="Editar Viatura">
          <svg viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
        </button>
        <button class="btn ${isBaixada ? 'primary' : 'danger'}" style="padding: 6px 10px; font-size: 11px;" onclick="alternarStatus('${v.prefixo}')">
          ${isBaixada ? '✅ Operar' : '⛔ Baixar'}
        </button>
      </div>
    </div>
  `;
}

// ============================================================
// AÇÕES
// ============================================================
window.mudarFiltro = (u) => { filtroAtivo = u; renderTudo(); };

window.mudarFiltroStatus = (status) => {
  if (filtroStatusAtivo === status) {
    filtroStatusAtivo = 'Total';
  } else {
    filtroStatusAtivo = status;
  }
  renderTudo();
};

document.getElementById('search').addEventListener('input', (e) => { termoBusca = e.target.value; renderBlocos(); });

// Modal de Edição / Adição
let editandoPrefixoOriginal = null;
const modal = document.getElementById('actionModal');
const modalTitle = document.getElementById('modalTitle');
const modalFields = document.getElementById('modalFields');

window.toggleEmpresa = () => {
  const prop = document.getElementById('fPropriedade').value;
  const labelEmpresa = document.getElementById('labelEmpresa');
  const inputEmpresa = document.getElementById('fEmpresa');
  if (prop === 'Locada') {
    labelEmpresa.style.display = 'flex';
  } else {
    labelEmpresa.style.display = 'none';
    inputEmpresa.value = ''; 
  }
};

function abrirModalNovo() {
  editandoPrefixoOriginal = null;
  modalTitle.innerText = 'Nova Viatura';
  modalFields.innerHTML = `
    <label>Prefixo <input type="text" id="fPrefixo" autocomplete="off" placeholder="Ex: ABS-01"></label>
    <label>Placa <input type="text" id="fPlaca" autocomplete="off" placeholder="Ex: ABC-1234"></label>
    <label>Tipo <input type="text" id="fTipo" autocomplete="off" placeholder="Ex: ABS, UR, APC" list="listaTipos"></label>
    <datalist id="listaTipos"><option value="ABS"><option value="ABT"><option value="UR"><option value="APC"><option value="AEM"></datalist>
    <label>Unidade <input type="text" id="fUnidade" autocomplete="off" placeholder="Ex: 1º GBM" list="listaUnidades"></label>
    <datalist id="listaUnidades">
      <option value="1º GBM"><option value="2º GBM"><option value="3º GBM"><option value="4º GBM">
      <option value="5º GBM"><option value="6º GBM"><option value="7º GBM"><option value="DEMAN">
    </datalist>
    <label>Propriedade <select id="fPropriedade" onchange="toggleEmpresa()">
      <option value="Própria">Própria</option><option value="Locada">Locada</option>
    </select></label>
    <label id="labelEmpresa" style="display:none;">Empresa (Locada) <input type="text" id="fEmpresa" autocomplete="off" placeholder="Nome da empresa"></label>
    <label>Cartão de Abastecimento <input type="text" id="fCartao" autocomplete="off" placeholder="Opcional"></label>
    <label>Status <select id="fStatus"><option value="Operante">Operante</option><option value="Baixada">Baixada</option></select></label>
    <label>Condutor <input type="text" id="fCondutor" autocomplete="off" placeholder="Nome do condutor"></label>
    <label>Contato <input type="text" id="fContato" autocomplete="off" placeholder="Ex: (65) 99999-9999"></label>
    <label>Observações <input type="text" id="fObs" autocomplete="off" placeholder="Opcional"></label>
  `;
  modal.style.display = 'flex';
}

function abrirModalEditar(index) {
  const v = viaturas[index];
  editandoPrefixoOriginal = v.prefixo;
  modalTitle.innerText = 'Editar Viatura';
  modalFields.innerHTML = `
    <label>Prefixo <input type="text" id="fPrefixo" autocomplete="off" value="${v.prefixo}"></label>
    <label>Placa <input type="text" id="fPlaca" autocomplete="off" value="${v.placa || ''}"></label>
    <label>Tipo <input type="text" id="fTipo" autocomplete="off" value="${v.tipo}" list="listaTipos"></label>
    <datalist id="listaTipos"><option value="ABS"><option value="ABT"><option value="UR"><option value="APC"><option value="AEM"></datalist>
    <label>Unidade <input type="text" id="fUnidade" autocomplete="off" value="${v.unidade}" list="listaUnidades"></label>
    <datalist id="listaUnidades">
      <option value="1º GBM"><option value="2º GBM"><option value="3º GBM"><option value="4º GBM">
      <option value="5º GBM"><option value="6º GBM"><option value="7º GBM"><option value="DEMAN">
    </datalist>
    <label>Propriedade <select id="fPropriedade" onchange="toggleEmpresa()">
      <option value="Própria" ${v.propriedade === 'Própria' ? 'selected' : ''}>Própria</option>
      <option value="Locada" ${v.propriedade === 'Locada' ? 'selected' : ''}>Locada</option>
    </select></label>
    <label id="labelEmpresa" style="${v.propriedade === 'Locada' ? 'display:flex;' : 'display:none;'}">Empresa (Locada) <input type="text" id="fEmpresa" autocomplete="off" value="${v.empresa || ''}" placeholder="Nome da empresa"></label>
    <label>Cartão de Abastecimento <input type="text" id="fCartao" autocomplete="off" value="${v.cartao || ''}" placeholder="Opcional"></label>
    <label>Status <select id="fStatus">
      <option value="Operante" ${v.status === 'Operante' ? 'selected' : ''}>Operante</option>
      <option value="Baixada" ${v.status === 'Baixada' ? 'selected' : ''}>Baixada</option>
    </select></label>
    <label>Condutor <input type="text" id="fCondutor" autocomplete="off" value="${v.condutor || ''}"></label>
    <label>Contato <input type="text" id="fContato" autocomplete="off" value="${v.contato || ''}" placeholder="Ex: (65) 99999-9999"></label>
    <label>Observações <input type="text" id="fObs" autocomplete="off" value="${v.obs || ''}"></label>
  `;
  setTimeout(toggleEmpresa, 10);
  modal.style.display = 'flex';
}

document.getElementById('modalCancel').onclick = () => modal.style.display = 'none';
document.getElementById('modalConfirm').onclick = () => {
  const dados = {
    prefixo: document.getElementById('fPrefixo').value.trim(),
    placa: document.getElementById('fPlaca').value.trim(),
    tipo: document.getElementById('fTipo').value.trim(),
    unidade: document.getElementById('fUnidade').value.trim(),
    propriedade: document.getElementById('fPropriedade').value,
    empresa: document.getElementById('fEmpresa').value.trim(),
    cartao: document.getElementById('fCartao').value.trim(),
    status: document.getElementById('fStatus').value,
    condutor: document.getElementById('fCondutor').value.trim(),
    contato: document.getElementById('fContato').value.trim(),
    obs: document.getElementById('fObs').value.trim()
  };
  if (!dados.prefixo) return alert('O prefixo é obrigatório!');

  const isNew = editandoPrefixoOriginal === null;
  
  enviarParaPlanilha('save', { viatura: dados, isNew: isNew, oldPrefixo: editandoPrefixoOriginal });
  
  modal.style.display = 'none';
};

function alternarStatus(prefixo) {
  const v = viaturas.find(x => x.prefixo === prefixo);
  const novoStatus = v.status === 'Operante' ? 'Baixada' : 'Operante';
  enviarParaPlanilha('toggleStatus', { prefixo: prefixo, status: novoStatus });
}

document.getElementById('addBtn').onclick = abrirModalNovo;

// ============================================================
// INICIALIZAÇÃO
// ============================================================
carregarDados();
</script>
</body>
</html>
